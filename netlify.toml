# Netlify, mit GitHub verbunden: die Seite liegt in app/, die Server-Teile (Link einfügen, Sammlung der Hosen) in netlify/functions/.
# Kein Build-Schritt. Die Test-Werkzeuge (Playwright usw.) werden nicht installiert.
[build]
  publish = "app"
  command = "echo kein Build-Schritt"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"          # bündelt @netlify/blobs (Sammlung der Hosen) in die Funktion

# Nach jedem Deploy alle benötigten Dateien auf der Live-Adresse prüfen (fehlte am 18.11.: avatar/koerper.js)
[[plugins]]
  package = "./netlify/plugins/live-pruefung"
